name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run compile:validator
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run pack:check 2>&1 | tee pack.log
      - name: assert tarball contents
        run: |
          grep -q "dist/lib/index.js"     pack.log || { echo "missing dist/lib/index.js";     exit 1; }
          grep -q "dist/lib/index.d.ts"   pack.log || { echo "missing dist/lib/index.d.ts";   exit 1; }
          grep -q "dist/lib/data/index.js" pack.log || { echo "missing dist/lib/data/index.js"; exit 1; }
          grep -q "dist/lib/schema.json"  pack.log || { echo "missing dist/lib/schema.json";  exit 1; }
          grep -q "dist/cli/bin.js"       pack.log || { echo "missing dist/cli/bin.js";       exit 1; }
