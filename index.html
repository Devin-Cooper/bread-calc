<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>breadmachine.io — Hydration calculator for bread machines</title>
  <meta name="description" content="Hydration calculator for bread machines. Calibrated for the Zojirushi BB-PDC20." />
  <link rel="canonical" href="https://breadmachine.io/" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta property="og:title" content="breadmachine.io" />
  <meta property="og:description" content="Bread machine hydration calculator" />
  <meta property="og:url" content="https://breadmachine.io/" />

  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-variable.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-variable.woff2" crossorigin />

  <link rel="stylesheet" href="/src/site/styles.css" />
</head>
<body>
  <header id="site-header" role="banner"></header>
  <div id="tip-strip"></div>
  <main>
    <section id="recipe-pane" aria-label="Recipe editor" class="card">
      <div id="template-picker"></div>
      <div id="recipe-headline"></div>
      <div id="ingredient-picker"></div>
      <div id="recipe-table" role="table" aria-label="Recipe ingredients"></div>
      <div id="recipe-meta"></div>
    </section>
    <section id="results-pane" aria-label="Recipe results">
      <div id="snapshot-card" class="card"></div>
      <div id="zone-band" class="card"></div>
      <div id="warnings-panel" class="card"></div>
      <div id="show-math-section" class="card"></div>
    </section>
  </main>
  <footer id="site-footer">
    <a href="https://github.com/Devin-Cooper/bread-calc">GitHub</a> ·
    <a href="https://github.com/Devin-Cooper/bread-calc/blob/main/LICENSE">MIT</a> ·
    <a href="/learn.html#privacy-and-share-urls">Privacy</a>
  </footer>
  <section id="kitchen-card"></section>
  <dialog id="settings-drawer"></dialog>
  <script type="module" src="/src/site/main.ts"></script>
</body>
</html>
